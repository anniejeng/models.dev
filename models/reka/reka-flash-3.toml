# Sources (accessed 2026-10-02):
# https://huggingface.co/RekaAI/reka-flash-3 (Apache-2.0; Hub createdAt 2025-03-11)
# https://developer.reka.ai/models (64k context; tools not supported on this model)
# limit.output: no published figure. Set to the largest single completion
# demonstrated on Reka's API (28,109 tokens, 2026-10-02), rounded down. The
# serving backend itself accepts max_tokens up to context minus prompt.
# Primarily an English model with limited multilingual understanding.
name = "Reka Flash 3"
description = "21B general-purpose reasoning model trained from scratch for low-latency chat, coding, and instruction following"
family = "reka"
release_date = "2025-03-11"
last_updated = "2025-03-11"
attachment = false
reasoning = true
temperature = true
tool_call = false
structured_output = true
open_weights = true
license = "Apache-2.0"

[limit]
context = 65_536
output = 28_000

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/RekaAI/reka-flash-3"
format = "safetensors"
